# 1. Monitor
monitor=,preferred,auto,1

# 2. Autostart Apps & Shell

exec-once = swaybg -c "#11111b"
exec-once = sh -c 'date >> /tmp/hypr-exec-test.log'
exec-once = python3 ~/.config/hypr/scripts/infinite_desktop_core.py 1.6 > /tmp/infinite-desktop.log 2>&1
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11,ssh
exec-once = dbus-update-activation-environment --systemd --all
exec-once = uwsm app -- ~/.local/bin/start-serpantinum.sh

# 3. Input Keyboard & Touchpad
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0
}

# 4. Tampilan & Layout (Gaps, Border, Colors)
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(585b70aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    # screen_shader = /home/focarix/.config/hypr/shaders/glossy_plastic.frag
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ==========================================
# KEYBINDS: Dikelola di ~/.config/hypr/hyprland/keybinds.lua
# Jangan tambahkan keybind di sini agar tidak duplikat/konflik.
# ==========================================

ecosystem {
    no_update_news = true
    no_donation_nag = true
}
